services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: murmur
      POSTGRES_PASSWORD: murmur
      POSTGRES_DB: murmur
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      gateway_net:
        ipv4_address: 172.31.240.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U murmur"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      gateway_net:
        ipv4_address: 172.31.240.11
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  core:
    build: ./murmur-core
    environment:
      DATABASE_URL: ${GATEWAY_DATABASE_URL:-postgresql://murmur:murmur@172.31.240.10:5432/murmur}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: ${GATEWAY_REDIS_URL:-redis://172.31.240.11:6379/0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: ${SERVICE_NAME:-murmur-api}
      QUEUE_NAME: ${QUEUE_NAME:-agent_queue}
    networks:
      gateway_net:
        ipv4_address: 172.31.240.12
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  billing:
    build: ./murmur-billing
    environment:
      DATABASE_URL: ${GATEWAY_DATABASE_URL:-postgresql://murmur:murmur@172.31.240.10:5432/murmur}
      STRIPE_KEY: ${STRIPE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      TIKTOK_WEBHOOK_SECRET: ${TIKTOK_WEBHOOK_SECRET}
      REDIS_HOST: ${GATEWAY_REDIS_HOST:-172.31.240.11}
      QUEUE_NAME: ${QUEUE_NAME:-agent_queue}
    networks:
      gateway_net:
        ipv4_address: 172.31.240.13
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3001:3001"

  worker:
    build: ./murmur-worker
    environment:
      DATABASE_URL: ${GATEWAY_DATABASE_URL:-postgresql://murmur:murmur@172.31.240.10:5432/murmur}
      REDIS_HOST: ${GATEWAY_REDIS_HOST:-172.31.240.11}
      CORE_URL: ${GATEWAY_CORE_URL:-http://172.31.240.12:8000}
      JWT_SECRET: ${JWT_SECRET}
      QUEUE_NAME: ${QUEUE_NAME:-agent_queue}
      DEAD_LETTER_QUEUE: ${DEAD_LETTER_QUEUE:-agent_queue_dead}
      MAX_JOB_RETRIES: ${MAX_JOB_RETRIES:-5}
    networks:
      gateway_net:
        ipv4_address: 172.31.240.14
    depends_on:
      core:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  web:
    build: ./murmur-web
    networks:
      gateway_net:
        ipv4_address: 172.31.240.15
    ports:
      - "3000:3000"

networks:
  gateway_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.240.0/24
