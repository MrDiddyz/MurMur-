name: MurMur CI

on:
  push:
    branches:
      - main
      - dev
      - "feature/**"
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check lockfile sync
        run: |
          cp package-lock.json package-lock.json.bak
          npm install --package-lock-only --silent
          diff -q package-lock.json package-lock.json.bak > /dev/null 2>&1 && IN_SYNC=true || IN_SYNC=false
          cp package-lock.json.bak package-lock.json
          rm package-lock.json.bak
          if [ "$IN_SYNC" = "false" ]; then
            echo "::error::package-lock.json is out of sync with package.json."
            echo "::error::Run 'npm install --package-lock-only' locally and commit the updated package-lock.json."
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Test
        run: npm test --if-present

      - name: Build
        run: npm run build --if-present

  python-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Install test dependencies
        run: pip install pytest

      - name: Install murmur dependencies
        run: pip install -r murmur/requirements.txt

      - name: Install project root (editable)
        # Attempt an editable install so local packages resolve correctly.
        # This step is best-effort: not all repo layouts expose a setup.py/pyproject.toml.
        run: pip install -e . --no-deps || true

      - name: Run Python tests
        run: pytest tests/ -v
